interface:
  display_name: "CMC Crypto Skill Hub"
  short_description: "Use CMC Crypto Skill Hub MCP tools"
  default_prompt: "Use $cmc-crypto-skill-hub to analyze BTC cross-asset conditions with CMC Crypto Skill Hub."

dependencies:
  tools:
    - type: "mcp"
      value: "crypto-skill-hub"
      description: "CMC Crypto Skill Hub Production MCP server"
      transport: "streamable_http"
      url: "https://mcp.coinmarketcap.com/skill-hub/stream"

policy:
  allow_implicit_invocation: true
